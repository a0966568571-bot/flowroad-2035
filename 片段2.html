<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FlowRoad 動態斑馬線</title>
<style>
  :root { --bg:#05080c; --ui:#e8edf2; --muted:#8b97a3; --accent:#5fd4ff; --panel:rgba(12,18,26,.82); }
  html,body { margin:0; height:100%; background:var(--bg); overflow:hidden;
    font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif; color:var(--ui); }
  #stage { position:absolute; left:50%; top:50%; width:1920px; height:1080px;
    transform-origin:center center; background:var(--bg); }
  #stage canvas { display:block; width:100%; height:100%; }
  #cap { position:absolute; left:96px; top:80px; opacity:0; pointer-events:none; }
  #cap .t1 { font-size:44px; font-weight:700; letter-spacing:2px; }
  #cap .t1 b { color:var(--accent); }
  #cap .t2 { margin-top:10px; font-size:28px; color:var(--muted); }
  #ui { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); display:flex; gap:8px;
    align-items:center; background:var(--panel); padding:8px 12px; border-radius:10px;
    max-width:calc(100vw - 32px); flex-wrap:wrap; justify-content:center; }
  #ui button { font:inherit; font-size:15px; color:var(--ui); background:#1b2632; border:1px solid #2e3d4c;
    border-radius:6px; padding:7px 14px; cursor:pointer; }
  #ui button.primary { background:#17607a; border-color:#3fa9cc; }
  #ui button:hover { filter:brightness(1.2); }
  #ui input[type=range] { width:220px; }
  #tc { font-variant-numeric:tabular-nums; font-size:14px; color:var(--muted); min-width:52px; }
  body.clean #ui, body.clean #cap { display:none; }
</style>
</head>

<script>
(() => {
  // ---------- 參數（單位：公尺、秒） ----------
  const T_END = 14;
  const LANE = 3.0;                 // 車道寬（雙向 4 車道）
  const ROAD_HALF = 2 * LANE + 0.2;
  const CAR_V = 10;                 // 巡航速度 36 km/h
  const BRAKE_A = 2.5, GO_A = 2.5;  // 一般減速、起步加速度
  const T_DECIDE = 1.5;             // AI 開始協調車輛的時間
  const STOP_P = -5.3;              // 車頭停止位置（停止線在 -5，斑馬線邊緣在 -2）
  const CW_HALF = 2;                // 斑馬線寬 4 公尺（z 方向）
  const N_STRIPE = 12, STRIPE_T0 = 3, STRIPE_T1 = 4.8;
  const TILE_X = 7.6;
  const WALK_T0 = 4.6, WALK_T1 = 11.8, WALK_X0 = TILE_X, WALK_X1 = -TILE_X;
  const TAPS = [0.4, 0.9];
  const RELEASE = { R: 9.4, L: 12.3 };   // 右半（先走過）與左半車道恢復通行
  const W = 1920, H = 1080;

  const params = new URLSearchParams(location.search);
  const CLEAN = params.has('clean');
  if (CLEAN) document.body.classList.add('clean');

  // ---------- 工具 ----------
  let seed = 20352;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const smooth = (a, b, x) => { const u = clamp((x - a) / (b - a), 0, 1); return u * u * (3 - 2 * u); };
  const ease = u => u * u * (3 - 2 * u);
  const lerp = (a, b, u) => a + (b - a) * u;
  const lerpV = (a, b, u) => a.map((v, i) => lerp(v, b[i], u));

  const personX = t => lerp(WALK_X0, WALK_X1, clamp((t - WALK_T0) / (WALK_T1 - WALK_T0), 0, 1));
  const stripeX = i => (N_STRIPE / 2 - 0.5 - i) * 1.0;            // 5.5 … -5.5，由近側往對面
  const stripeT = i => STRIPE_T0 + i * (STRIPE_T1 - STRIPE_T0) / N_STRIPE;
  function stripeAlpha(i, t) {
    const grow = smooth(stripeT(i), stripeT(i) + 0.25, t);
    const passed = 1 - smooth(1.0, 3.0, stripeX(i) - personX(t));
    const endFade = 1 - smooth(WALK_T1, WALK_T1 + 0.6, t);
    return grow * passed * endFade;
  }
  const stripeGlow = (i, t) =>
    (t > WALK_T0 && t < WALK_T1 + 0.2) ? Math.exp(-(((personX(t) - stripeX(i)) / 0.45) ** 2)) : 0;

  // ---------- 場景 ----------
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(W, H, false);
  document.getElementById('stage').prepend(renderer.domElement);

  const scene = new THREE.Scene();
  const BG = 0x05080c;
  scene.background = new THREE.Color(BG);
  scene.fog = new THREE.Fog(BG, 70, 240);
  const camera = new THREE.PerspectiveCamera(38, W / H, 0.3, 700);

  scene.add(new THREE.HemisphereLight(0x9fb4c8, 0x0a0f14, 0.85));
  const sun = new THREE.DirectionalLight(0xdfe8f0, 0.6);
  sun.position.set(30, 60, 20);
  scene.add(sun);

  const Z_NEAR = 200, Z_FAR = -260, ROAD_LEN = Z_NEAR - Z_FAR, ROAD_MID = (Z_NEAR + Z_FAR) / 2;
  const plane = (w, l, mat, x, y, z) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, l), mat);
    m.rotation.x = -Math.PI / 2; m.position.set(x, y, z); scene.add(m); return m;

  plane(400, ROAD_LEN, new THREE.MeshLambertMaterial({ color: 0x070b10 }), 0, -0.02, ROAD_MID);
  const grid = new THREE.GridHelper(800, 160, 0x13222d, 0x0e1a23);
  grid.position.set(0, -0.01, ROAD_MID); scene.add(grid);
  plane(ROAD_HALF * 2, ROAD_LEN, new THREE.MeshLambertMaterial({ color: 0x1c242e }), 0, 0, ROAD_MID);
  for (const s of [-1, 1]) {
    const walk = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.18, ROAD_LEN),
      new THREE.MeshLambertMaterial({ color: 0x1b242e }));
    walk.position.set(s * (ROAD_HALF + 1.8), 0.09, ROAD_MID); scene.add(walk);

  // 標線：中央雙黃線、車道虛線、路緣白線
  const lineMat = new THREE.MeshBasicMaterial({ color: 0x9aa9b7 });
  const yellowMat = new THREE.MeshBasicMaterial({ color: 0xb08a2a });
  for (const x of [-0.15, 0.15]) plane(0.12, ROAD_LEN, yellowMat, x, 0.01, ROAD_MID);
  for (const x of [-(ROAD_HALF - 0.15), ROAD_HALF - 0.15]) plane(0.15, ROAD_LEN, lineMat, x, 0.01, ROAD_MID);
  for (const x of [-LANE, LANE]) for (let z = Z_NEAR; z > Z_FAR; z -= 9) plane(0.13, 3, lineMat, x, 0.01, z);

  // 建築與行道樹
  const bMat = new THREE.MeshLambertMaterial({ color: 0x16212d, transparent: true, opacity: 0.88 });
  const eMat = new THREE.LineBasicMaterial({ color: 0x3f86a8, transparent: true, opacity: 0.8 });
  for (const s of [-1, 1]) {
    let z = Z_NEAR;
    while (z > Z_FAR) {
      const len = 10 + rnd() * 16, dep = 10 + rnd() * 14, h = 6 + rnd() * 30;
      const g = new THREE.BoxGeometry(dep, h, len - 1.5);
      const b = new THREE.Mesh(g, bMat);
      b.position.set(s * (ROAD_HALF + 4.6 + dep / 2), h / 2, z - len / 2); scene.add(b);
      const e = new THREE.LineSegments(new THREE.EdgesGeometry(g), eMat);
      e.position.copy(b.position); scene.add(e);
      z -= len;
    }
  }
  const trunkGeo = new THREE.CylinderGeometry(0.12, 0.16, 1.6, 6);
  const crownGeo = new THREE.IcosahedronGeometry(1.3, 0);
  const trunkMat = new THREE.MeshLambertMaterial({ color: 0x2a2420 });
  const crownMat = new THREE.MeshLambertMaterial({ color: 0x1d3b36, flatShading: true });
  for (const s of [-1, 1]) for (let z = Z_NEAR - 4; z > Z_FAR; z -= 12) {
    if (Math.abs(z) < 7) continue;            // 路口附近不種樹，讓出穿越區
    const x = s * (ROAD_HALF + 2.6);
    const tr = new THREE.Mesh(trunkGeo, trunkMat); tr.position.set(x, 0.98, z); scene.add(tr);
    const cr = new THREE.Mesh(crownGeo, crownMat); cr.position.set(x, 2.5, z); cr.rotation.y = rnd() * 3; scene.add(cr);
  }

  // 光暈貼圖
  const glowCv = document.createElement('canvas'); glowCv.width = glowCv.height = 64;
  const gg = glowCv.getContext('2d'); const rg = gg.createRadialGradient(32, 32, 0, 32, 32, 32);
  rg.addColorStop(0, 'rgba(255,255,255,1)'); rg.addColorStop(1, 'rgba(255,255,255,0)');
  gg.fillStyle = rg; gg.fillRect(0, 0, 64, 64);
  const glowTex = new THREE.CanvasTexture(glowCv);
  const glowMat = color => new THREE.MeshBasicMaterial({ map: glowTex, color, transparent: true,
    blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0 });
  const addMat = color => new THREE.MeshBasicMaterial({ color, transparent: true,
    blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0, side: THREE.DoubleSide });

  // ---------- 智慧地磚與光波 ----------
  const TILE_Y = 0.185;
  const tileBase = plane(1.1, 1.1, new THREE.MeshBasicMaterial({ color: 0x12384a }), TILE_X, TILE_Y, 0);
  const tileRing = new THREE.Mesh(new THREE.RingGeometry(0.5, 0.58, 4, 1), addMat(0x5fd4ff));
  tileRing.rotation.set(-Math.PI / 2, 0, Math.PI / 4); tileRing.position.set(TILE_X, TILE_Y + 0.01, 0); scene.add(tileRing);
  const tileGlow = plane(4, 4, glowMat(0x5fd4ff), TILE_X, TILE_Y + 0.02, 0);
  const ripples = TAPS.map(() => {
    const r = new THREE.Mesh(new THREE.RingGeometry(0.9, 1.0, 48), addMat(0x7fe0ff));
    r.rotation.x = -Math.PI / 2; r.position.set(TILE_X, TILE_Y + 0.03, 0); scene.add(r); return r;
  });

  // ---------- AI 掃描線、停止線、斑馬線 ----------
  const scans = [-1, 1].map(() => plane(ROAD_HALF * 2, 1.2, addMat(0x5fd4ff), 0, 0.04, 0));
  const scanDist = t => 48 * (t - T_DECIDE);
  const stopLines = {
    R: plane(ROAD_HALF - 0.3, 0.4, addMat(0xeaf6ff), (ROAD_HALF - 0.3) / 2 + 0.15, 0.03, 5),
    L: plane(ROAD_HALF - 0.3, 0.4, addMat(0xeaf6ff), -(ROAD_HALF - 0.3) / 2 - 0.15, 0.03, -5),
  };
  const stripes = [];
  for (let i = 0; i < N_STRIPE; i++) {
    const m = plane(0.5, CW_HALF * 2, new THREE.MeshBasicMaterial({ color: 0xeaf6ff, transparent: true, opacity: 0, depthWrite: false }),
      stripeX(i), 0.035, 0);
    const g = plane(1.6, CW_HALF * 2 + 1.2, glowMat(0x6fe0ff), stripeX(i), 0.05, 0);
    stripes.push({ m, g });
  }

  // ---------- 車輛 ----------
  const CAR_COLORS = [0x8a96a3, 0x5e6b78, 0xb7c0c8, 0x3f4a56, 0x7d8794, 0xa39a8c, 0x6f7f74];
  const glassMat = new THREE.MeshLambertMaterial({ color: 0x0b1118 });
  const headMat = new THREE.MeshBasicMaterial({ color: 0xdfe6ee });
  function makeCar(color) {
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(1.86, 0.7, 4.4), new THREE.MeshLambertMaterial({ color }));
    body.position.y = 0.55; g.add(body);
    const cab = new THREE.Mesh(new THREE.BoxGeometry(1.62, 0.55, 2.2), glassMat);
    cab.position.set(0, 1.17, 0.25); g.add(cab);
    const roof = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.06, 1.9), new THREE.MeshLambertMaterial({ color }));
    roof.position.set(0, 1.47, 0.3); g.add(roof);
    const tail = new THREE.MeshBasicMaterial({ color: 0x8a1018 });
    for (const sx of [-0.7, 0.7]) {
      const tl = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.14, 0.05), tail); tl.position.set(sx, 0.68, 2.21); g.add(tl);
      const hl = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.14, 0.05), headMat); hl.position.set(sx, 0.62, -2.21); g.add(hl);
    }
    const brakeGlow = new THREE.Mesh(new THREE.PlaneGeometry(3, 1.6), glowMat(0xff2030));
    brakeGlow.rotation.x = -Math.PI / 2; brakeGlow.position.set(0, 0.7, 2.6); g.add(brakeGlow);
    const halo = new THREE.Mesh(new THREE.PlaneGeometry(3.4, 6.2), glowMat(0x5fd4ff));
    halo.rotation.x = -Math.PI / 2; halo.position.set(0, 0.06, 0); g.add(halo);
    g.userData = { tail, brakeGlow, halo };
    scene.add(g); return g;
  }

  // p＝沿行進方向的座標（兩個方向都一樣：停止線 -5，斑馬線 -2～2）
  const LANES = [
    { x: LANE * 0.5, d: -1, half: 'R' }, { x: LANE * 1.5, d: -1, half: 'R' },
    { x: -LANE * 0.5, d: 1, half: 'L' }, { x: -LANE * 1.5, d: 1, half: 'L' },
  ];
  const cars = [];
  for (const ln of LANES) {
    const list = [];
    for (let p = 40 - rnd() * 10; p > -95; p -= 15 + rnd() * 10) {
      const p15 = p + CAR_V * T_DECIDE;
      if (p15 + 2.2 > -27 && p15 - 2.2 < 4) continue;   // 來不及舒適停下的位置不放車
      list.push(p);
    }
    const queue = list.filter(p => p + CAR_V * T_DECIDE < -27).sort((a, b) => b - a);
    let prevRel = -Infinity;
    queue.forEach((p0, k) => {
      const P = STOP_P - 2.2 - k * 6.4;                   // 第 k 輛的車身中心停止點
      let tb = (P - CAR_V * CAR_V / (2 * BRAKE_A) - p0) / CAR_V, a = BRAKE_A;
      if (tb < T_DECIDE) { tb = T_DECIDE; a = CAR_V * CAR_V / (2 * (P - (p0 + CAR_V * T_DECIDE))); }
      const ts = tb + CAR_V / a;
      const tr = Math.max(RELEASE[ln.half] + 0.7 * k, ts + 0.4, prevRel + 0.7);
      prevRel = tr;
      cars.push({ ln, p0, stop: { P, tb, a, ts, tr, k } });
    });
    for (const p0 of list) if (!queue.includes(p0)) cars.push({ ln, p0, stop: null });
  }
  for (const c of cars) c.obj = makeCar(CAR_COLORS[Math.floor(rnd() * CAR_COLORS.length)]);

  function carP(c, t) {
    const s = c.stop;
    if (!s || t < s.tb) return c.p0 + CAR_V * t;
    const pb = c.p0 + CAR_V * s.tb;
    if (t < s.ts) { const u = t - s.tb; return pb + CAR_V * u - s.a * u * u / 2; }
    if (t < s.tr) return s.P;
    const u = t - s.tr, tv = CAR_V / GO_A;
    return u < tv ? s.P + GO_A * u * u / 2 : s.P + CAR_V * CAR_V / (2 * GO_A) + CAR_V * (u - tv);
  }
  const VISIBLE = 60;
  const nStop = cars.filter(c => c.stop && Math.abs(c.stop.P) < VISIBLE).length;
  document.getElementById('nStop').textContent = nStop;

  // ---------- 人物（看不到臉的簡單人形：白上衣、牛仔褲、側背包） ----------
  const person = new THREE.Group();
  const P_SC = 1.15;                         // 俯拍時人看起來太小，略放大
  {
    const jeans = new THREE.MeshLambertMaterial({ color: 0x3d5a80 });
    const shirt = new THREE.MeshLambertMaterial({ color: 0xf0f2f4 });
    const skin = new THREE.MeshLambertMaterial({ color: 0xd9b08c });
    const hair = new THREE.MeshLambertMaterial({ color: 0x1a1410 });
    const bagM = new THREE.MeshLambertMaterial({ color: 0x7a5232 });
    const limb = (w, h, d, mat, px, py) => {
      const pivot = new THREE.Group(); pivot.position.set(px, py, 0);
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.y = -h / 2; pivot.add(m);
      person.add(pivot); return pivot;
    };
    person.userData.legL = limb(0.17, 0.82, 0.2, jeans, -0.11, 0.84);
    person.userData.legR = limb(0.17, 0.82, 0.2, jeans, 0.11, 0.84);
    const torso = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.56, 0.24), shirt); torso.position.y = 1.12; person.add(torso);
    person.userData.armL = limb(0.11, 0.6, 0.12, skin, -0.28, 1.38);
    person.userData.armR = limb(0.11, 0.6, 0.12, skin, 0.28, 1.38);
    for (const a of [person.userData.armL, person.userData.armR]) {
      const sl = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.22, 0.14), shirt); sl.position.y = -0.1; a.add(sl);
    }
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.13, 10, 8), skin); head.position.y = 1.55; person.add(head);
    const hr = new THREE.Mesh(new THREE.SphereGeometry(0.14, 10, 8, 0, Math.PI * 2, 0, Math.PI * 0.6), hair);
    hr.position.y = 1.57; person.add(hr);
    const pony = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.22, 0.08), hair); pony.position.set(0, 1.45, 0.14); person.add(pony);
    const bag = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.24, 0.3), bagM); bag.position.set(0.3, 0.92, 0.02); person.add(bag);
    const strap = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.62, 0.05), bagM); strap.position.set(0.05, 1.2, -0.13);
    strap.rotation.z = 0.75; person.add(strap);
    const shadow = new THREE.Mesh(new THREE.CircleGeometry(0.4, 16),
      new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.45, depthWrite: false }));
    shadow.rotation.x = -Math.PI / 2; shadow.position.y = 0.01; person.add(shadow);
  }
  person.scale.setScalar(P_SC);
  person.rotation.y = Math.PI / 2;           // 模型朝 -z，轉成面向 -x（往對面走）
  scene.add(person);

  // ---------- 鏡頭 ----------
  const SHOTS = [
    { t: 0,   pos: [6.8, 4.2, 9],  look: [7.4, 0.6, 0] },   // 近拍腳下的地磚
    { t: 1.3, pos: [6.5, 5.5, 11], look: [7.0, 0.5, 0] },
    { t: 2.8, pos: [5, 30, 36],    look: [1, 0, -4] },      // 拉高看掃描與車輛停下
    { t: 4.6, pos: [5, 12, 17],  look: [2.5, 0, -1] },
  ];
  const trackCam = t => { const px = personX(t); return { pos: [px * 0.55 + 2.5, 10.5, 15.5], look: [px * 0.85, 0.6, -1] }; };
  const END = { pos: [0, 34, 34], look: [-1, 0, -6] };
  function camAt(t) {
    if (t <= SHOTS[SHOTS.length - 1].t) {
      let i = 0; while (i < SHOTS.length - 2 && t > SHOTS[i + 1].t) i++;
      const a = SHOTS[i], b = SHOTS[i + 1], u = ease(clamp((t - a.t) / (b.t - a.t), 0, 1));
      return { pos: lerpV(a.pos, b.pos, u), look: lerpV(a.look, b.look, u) };
    }
    // 4.6 秒後跟著人橫移；開頭 0.8 秒從固定鏡頭過渡過去
    const last = SHOTS[SHOTS.length - 1];
    let cam = trackCam(Math.min(t, WALK_T1));
    const inU = ease(clamp((t - WALK_T0) / 0.8, 0, 1));
    cam = { pos: lerpV(last.pos, cam.pos, inU), look: lerpV(last.look, cam.look, inU) };
    const outU = ease(clamp((t - WALK_T1) / 2, 0, 1));
    return { pos: lerpV(cam.pos, END.pos, outU), look: lerpV(cam.look, END.look, outU) };
  }

  // ---------- 每一格的狀態（只由 t 決定） ----------
  const capEl = document.getElementById('cap');
  let capOn = true;
  function render(t) {
    // 地磚：踏兩下的光波，之後保持亮著直到走完
    TAPS.forEach((tp, i) => {
      const u = clamp((t - tp) / 0.9, 0, 1), on = t >= tp && u < 1;
      ripples[i].scale.setScalar(0.3 + u * 3);
      ripples[i].material.opacity = on ? (1 - u) * 0.9 : 0;
    });
    const flash = TAPS.reduce((m, tp) => Math.max(m, t >= tp ? Math.exp(-(t - tp) * 5) : 0), 0);
    const tileOn = smooth(TAPS[0], TAPS[0] + 0.1, t) * (1 - smooth(WALK_T1, WALK_T1 + 0.8, t));
    tileRing.material.opacity = Math.min(1, 0.5 * tileOn + flash);
    tileGlow.material.opacity = 0.25 * tileOn + 0.6 * flash;
    tileBase.material.color.setHex(tileOn > 0.5 ? 0x1b5a74 : 0x12384a);

    // 掃描線往兩個方向推出去
    const sd = scanDist(t);
    scans.forEach((s, i) => {
      const on = t >= T_DECIDE && sd < 70;
      s.position.z = (i ? 1 : -1) * Math.max(sd, 0);
      s.material.opacity = on ? 0.7 * (1 - sd / 70) : 0;
    });
    for (const h of ['R', 'L']) {
      stopLines[h].material.opacity = smooth(1.6, 2.2, t) * (1 - smooth(RELEASE[h] - 0.4, RELEASE[h], t)) * 0.95;
    }
    stripes.forEach((s, i) => {
      const a = stripeAlpha(i, t), g = stripeGlow(i, t);
      const pop = smooth(stripeT(i), stripeT(i) + 0.25, t);
      s.m.scale.y = 0.2 + 0.8 * pop;
      s.m.material.opacity = 0.9 * a;
      const birth = Math.exp(-Math.max(t - stripeT(i), 0) * 4) * (t >= stripeT(i) ? 1 : 0);
      s.g.material.opacity = a * (0.18 + 0.75 * g) + 0.5 * birth * a;
    });

    for (const c of cars) {
      const p = carP(c, t), d = c.ln.d;
      c.obj.position.set(c.ln.x, 0, d * p);
      c.obj.rotation.y = d < 0 ? 0 : Math.PI;
      const s = c.stop;
      const braking = s && t >= s.tb && t < s.tr + 0.3;
      c.obj.userData.tail.color.setHex(braking ? 0xff2030 : 0x8a1018);
      c.obj.userData.brakeGlow.material.opacity = braking ? 0.55 : 0;
      // 被 AI 協調的車：掃描線掃到時亮起，恢復通行後淡掉
      const lit = s && t >= T_DECIDE && Math.abs(d * p) < Math.max(sd, 0);
      c.obj.userData.halo.material.opacity = lit ? 0.45 * (1 - smooth(s.tr, s.tr + 1, t)) : 0;
    }

    // 人物：踏兩下 → 等待 → 走過去
    const ud = person.userData;
    const px = personX(t);
    person.position.set(px, TILE_Y * (px > ROAD_HALF || px < -ROAD_HALF ? 1 : 0), 0);
    let legR = 0, legL = 0, armR = 0, armL = 0, bob = 0;
    for (const tp of TAPS) { const u = (t - (tp - 0.25)) / 0.3; if (u > 0 && u < 1) legR = -0.55 * Math.sin(Math.PI * u); }
    if (t > WALK_T0 && t < WALK_T1) {
      const ph = 2 * Math.PI * 1.0 * (t - WALK_T0);
      const amp = 0.45 * smooth(WALK_T0, WALK_T0 + 0.3, t) * (1 - smooth(WALK_T1 - 0.3, WALK_T1, t));
      legL = amp * Math.sin(ph); legR = -amp * Math.sin(ph);
      armL = -0.8 * legL; armR = -0.8 * legR;
      bob = 0.04 * Math.abs(Math.sin(ph)) * (amp / 0.45);
    }
    ud.legL.rotation.x = legL; ud.legR.rotation.x = legR; ud.armL.rotation.x = armL; ud.armR.rotation.x = armR;
    person.position.y += bob;
    // 走到對面後轉身半圈，面向鏡頭這側
    person.rotation.y = Math.PI / 2 + Math.PI / 2 * smooth(WALK_T1 + 0.2, WALK_T1 + 1.0, t);

    const cam = camAt(t);
    camera.position.set(...cam.pos);
    camera.lookAt(...cam.look);

    capEl.style.opacity = capOn ? (smooth(3.0, 3.6, t) * (1 - smooth(8.5, 9.1, t))).toFixed(3) : 0;
    renderer.render(scene, camera);
  }

  // 檢查用：斑馬線上有沒有車、停車位置、減速度、車距
  function state(t) {
    let carOnCrosswalk = 0, minCarGap = Infinity;
    const px = personX(t);
    const onRoad = Math.abs(px) < ROAD_HALF;
    for (const ln of LANES) {
      const inLane = cars.filter(c => c.ln === ln).map(c => carP(c, t)).sort((a, b) => b - a);
      for (let i = 1; i < inLane.length; i++) minCarGap = Math.min(minCarGap, inLane[i - 1] - inLane[i] - 4.4);
      const laneStripeOn = stripes.some((s, i) => Math.abs(stripeX(i) - ln.x) < LANE / 2 && stripeAlpha(i, t) > 0.02);
      for (const p of inLane) {
        const overlap = p + 2.2 > -CW_HALF && p - 2.2 < CW_HALF;
        if (overlap && (laneStripeOn || (onRoad && Math.abs(px - ln.x) < LANE))) carOnCrosswalk++;
      }
    }
    return { t, px: +px.toFixed(2), carOnCrosswalk, minCarGap: +minCarGap.toFixed(2) };
  }
  function summary() {
    const st = cars.filter(c => c.stop);
    return {
      cars: cars.length, stopping: st.length, visibleStopping: nStop,
      maxDecel: +Math.max(...st.map(c => c.stop.a)).toFixed(2),
      firstStopFrontToCrosswalk: +(-CW_HALF - (STOP_P)).toFixed(2),
      allStoppedBy: +Math.max(...st.filter(c => Math.abs(c.stop.P) < VISIBLE).map(c => c.stop.ts)).toFixed(2),
      firstStripe: STRIPE_T0,
    };
  }
  // 音效用的事件時間表
  function events() {
    const vis = cars.filter(c => c.stop && Math.abs(c.stop.P) < VISIBLE);
    const steps = [];
    for (let k = 0; ; k++) { const ts = WALK_T0 + 0.25 + 0.5 * k; if (ts > WALK_T1) break; steps.push({ t: ts, x: personX(ts), onStripe: Math.abs(personX(ts)) < ROAD_HALF }); }
    return {
      T_END, taps: TAPS, scan: T_DECIDE, stopLine: 1.6,
      brakes: vis.map(c => ({ t: c.stop.tb, x: c.ln.x, z: c.ln.d * c.stop.P })),
      stripes: stripes.map((s, i) => ({ t: stripeT(i), x: stripeX(i) })),
      steps, releases: vis.map(c => ({ t: c.stop.tr, x: c.ln.x })), walkEnd: WALK_T1,
    };
  }
  window.flow = { render, state, summary, events, T_END };

  // ---------- 播放控制 ----------
  const scrub = document.getElementById('scrub'), tc = document.getElementById('tc');
  let playing = false, start = 0, cur = parseFloat(params.get('t')) || 0;
  // 音效與動畫同一條時間軸：播放時把音軌對到目前秒數
  const sfx = document.getElementById('sfx');
  const play = () => { playing = true; start = performance.now() - cur * 1000;
    sfx.currentTime = cur; sfx.play().catch(() => {}); };
  const restart = () => { cur = 0; play(); };
  document.getElementById('go').onclick = restart;
  document.getElementById('replay').onclick = restart;
  document.getElementById('capBtn').onclick = e => { capOn = !capOn; e.target.textContent = '字卡：' + (capOn ? '開' : '關'); };
  document.getElementById('sndBtn').onclick = e => { sfx.muted = !sfx.muted; e.target.textContent = '音效：' + (sfx.muted ? '關' : '開'); };
  scrub.oninput = () => { playing = false; sfx.pause(); cur = parseFloat(scrub.value); };
  addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); restart(); } });

  function fit() {
    const s = Math.min(innerWidth / W, innerHeight / H);
    document.getElementById('stage').style.transform = `translate(-50%,-50%) scale(${s})`;
  }
  addEventListener('resize', fit); fit();

  function loop(now) {
    if (playing) {
      cur = Math.min((now - start) / 1000, T_END);
      if (cur >= T_END) playing = false;
    }
    scrub.value = cur; tc.textContent = cur.toFixed(1) + ' s';
    render(cur);
    requestAnimationFrame(loop);
  }
  // 影片版：停在第一格 1 秒（方便開始錄影）後自動播放；按空白鍵重播（瀏覽器要先有一次按鍵或點擊才會出聲）
  if (CLEAN && !params.has('t')) setTimeout(play, 1000);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
