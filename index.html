<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FlowRoad 救護車通道</title>
<style>
  :root { --bg:#05080c; --ui:#e8edf2; --muted:#8b97a3; --accent:#ff3b48; --panel:rgba(12,18,26,.82); }
  html,body { margin:0; height:100%; background:var(--bg); overflow:hidden;
    font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif; color:var(--ui); }
  #stage { position:absolute; left:50%; top:50%; width:1920px; height:1080px;
    transform-origin:center center; background:var(--bg); }
  #stage canvas { display:block; width:100%; height:100%; }
  #cap { position:absolute; left:96px; top:80px; opacity:0; pointer-events:none; }
  #cap .t1 { font-size:44px; font-weight:700; letter-spacing:2px; }
  #cap .t1 b { color:var(--accent); }
  #cap .t2 { margin-top:10px; font-size:28px; color:var(--muted); }
  #ui { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); display:flex; gap:8px;
    align-items:center; background:var(--panel); padding:8px 12px; border-radius:10px;
    max-width:calc(100vw - 32px); flex-wrap:wrap; justify-content:center; }
  #ui button { font:inherit; font-size:15px; color:var(--ui); background:#1b2632; border:1px solid #2e3d4c;
    border-radius:6px; padding:7px 14px; cursor:pointer; }
  #ui button.primary { background:#b3202b; border-color:#e0434e; }
  #ui button:hover { filter:brightness(1.2); }
  #ui input[type=range] { width:220px; }
  #tc { font-variant-numeric:tabular-nums; font-size:14px; color:var(--muted); min-width:52px; }
  body.clean #ui, body.clean #cap { display:none; }
</style>
</head>
<body>
<div id="stage">
  <div id="cap">
    <div class="t1"><b>ColorFlow</b>｜緊急通道啟用</div>
    <div class="t2">救護車前方 25 公尺持續淨空</div>
  </div>
</div>
<div id="ui">
  <button id="go" class="primary">派出救護車</button>
  <button id="replay">重播</button>
  <button id="capBtn">字卡：開</button>
  <button id="sndBtn">音效：開</button>
  <input id="scrub" type="range" min="0" max="12" step="0.05" value="0">
  <span id="tc">0.0 s</span>
</div>

  sun.position.set(30, 60, 20);
  scene.add(sun);

  const Z_NEAR = 120, Z_FAR = -520, ROAD_LEN = Z_NEAR - Z_FAR, ROAD_MID = (Z_NEAR + Z_FAR) / 2;
  const flat = (w, l, color, y, x = 0, z = ROAD_MID, extra = {}) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, l),
      new THREE.MeshLambertMaterial(Object.assign({ color }, extra)));
    m.rotation.x = -Math.PI / 2; m.position.set(x, y, z); scene.add(m); return m;
  };

  // 地面、格線
  flat(400, ROAD_LEN, 0x070b10, -0.02);
  const grid = new THREE.GridHelper(800, 160, 0x13222d, 0x0e1a23);
  grid.position.set(0, -0.01, ROAD_MID); scene.add(grid);

  // 路面、人行道
  const ROAD_HALF = LANE * 1.5 + 0.6;
  flat(ROAD_HALF * 2, ROAD_LEN, 0x1c242e, 0);
  for (const s of [-1, 1]) {
    const walk = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.18, ROAD_LEN),
      new THREE.MeshLambertMaterial({ color: 0x1b242e }));
    walk.position.set(s * (ROAD_HALF + 1.8), 0.09, ROAD_MID); scene.add(walk);
  }

  // 標線
  const lineMat = new THREE.MeshBasicMaterial({ color: 0x9aa9b7 });
  for (const x of [-LANE * 1.5, LANE * 1.5]) {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(0.15, ROAD_LEN), lineMat);
    m.rotation.x = -Math.PI / 2; m.position.set(x, 0.01, ROAD_MID); scene.add(m);
  }
  const dashGeo = new THREE.PlaneGeometry(0.13, 3);
  for (const x of [-LANE / 2, LANE / 2]) {
    for (let z = Z_NEAR; z > Z_FAR; z -= 9) {
      const m = new THREE.Mesh(dashGeo, lineMat);
      m.rotation.x = -Math.PI / 2; m.position.set(x, 0.01, z); scene.add(m);
    }
  }

  // 建築（半透明＋輪廓線）與行道樹
  const bMat = new THREE.MeshLambertMaterial({ color: 0x16212d, transparent: true, opacity: 0.88 });
  const eMat = new THREE.LineBasicMaterial({ color: 0x3f86a8, transparent: true, opacity: 0.8 });
  for (const s of [-1, 1]) {
    let z = Z_NEAR;
    while (z > Z_FAR) {
      const len = 10 + rnd() * 16, dep = 10 + rnd() * 14, h = 6 + rnd() * 34;
      const g = new THREE.BoxGeometry(dep, h, len - 1.5);
      const b = new THREE.Mesh(g, bMat);
      b.position.set(s * (ROAD_HALF + 4.6 + dep / 2), h / 2, z - len / 2); scene.add(b);
      const e = new THREE.LineSegments(new THREE.EdgesGeometry(g), eMat);
      e.position.copy(b.position); scene.add(e);
      z -= len;
    }
  }
  const trunkGeo = new THREE.CylinderGeometry(0.12, 0.16, 1.6, 6);
  const crownGeo = new THREE.IcosahedronGeometry(1.3, 0);
  const trunkMat = new THREE.MeshLambertMaterial({ color: 0x2a2420 });
  const crownMat = new THREE.MeshLambertMaterial({ color: 0x1d3b36, flatShading: true });
  for (const s of [-1, 1]) for (let z = Z_NEAR - 4; z > Z_FAR; z -= 12) {
    const x = s * (ROAD_HALF + 2.4);
    const tr = new THREE.Mesh(trunkGeo, trunkMat); tr.position.set(x, 0.98, z); scene.add(tr);
    const cr = new THREE.Mesh(crownGeo, crownMat); cr.position.set(x, 2.5, z); cr.rotation.y = rnd() * 3; scene.add(cr);
  }

  // ---------- 紅色緊急車道（shader 依世界座標 z 決定範圍） ----------
  const laneU = {
    uFront: { value: 0 }, uTail: { value: 0 }, uTailLen: { value: 18 },
    uGrow: { value: 0 }, uTime: { value: 0 }
  };
  const laneMat = new THREE.ShaderMaterial({
    uniforms: laneU, transparent: true, depthWrite: false,
    vertexShader: `
      varying vec3 vW; varying vec2 vUv;
      void main(){ vUv = uv; vec4 w = modelMatrix * vec4(position,1.0); vW = w.xyz;
        gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: `
      uniform float uFront, uTail, uTailLen, uGrow, uTime;
      varying vec3 vW; varying vec2 vUv;
      void main(){
        float z = vW.z;
        float inside = step(uFront, z);
        float tail = 1.0 - smoothstep(uTail, uTail + uTailLen, z);
        float a = inside * tail * uGrow;
        if (a < 0.002) discard;
        float ex = abs(vUv.x - 0.5) * 2.0;
        float edge = smoothstep(0.82, 0.93, ex);
        float c = fract((-z) / 4.5 - ex * 0.55 - uTime * 1.6);
        float chev = smoothstep(0.0, 0.06, c) * (1.0 - smoothstep(0.18, 0.26, c)) * (1.0 - edge);
        float fg = exp(-(z - uFront) / 1.2);
        vec3 col = vec3(0.62, 0.04, 0.08)
                 + vec3(1.0, 0.22, 0.26) * (edge * 0.85 + chev * 0.30)
                 + vec3(1.0, 0.55, 0.55) * fg * 0.9;
        gl_FragColor = vec4(col, a * (0.80 + 0.2 * edge));
      }`
  });
  const laneMesh = new THREE.Mesh(new THREE.PlaneGeometry(LANE + 0.1, ROAD_LEN), laneMat);
  laneMesh.rotation.x = -Math.PI / 2; laneMesh.position.set(0, 0.025, ROAD_MID);
  scene.add(laneMesh);

  // 前緣光牆
  const wallCv = document.createElement('canvas'); wallCv.width = 4; wallCv.height = 128;
  const wg = wallCv.getContext('2d'); const grd = wg.createLinearGradient(0, 128, 0, 0);
  grd.addColorStop(0, 'rgba(255,80,90,1)'); grd.addColorStop(1, 'rgba(255,80,90,0)');
  wg.fillStyle = grd; wg.fillRect(0, 0, 4, 128);
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(LANE + 0.1, 1.8),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(wallCv), transparent: true,
      blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
  scene.add(wall);

  // 光暈貼圖
  const glowCv = document.createElement('canvas'); glowCv.width = glowCv.height = 64;
  const gg = glowCv.getContext('2d'); const rg = gg.createRadialGradient(32, 32, 0, 32, 32, 32);
  rg.addColorStop(0, 'rgba(255,255,255,1)'); rg.addColorStop(1, 'rgba(255,255,255,0)');
  gg.fillStyle = rg; gg.fillRect(0, 0, 64, 64);
  const glowTex = new THREE.CanvasTexture(glowCv);
  const glowMat = color => new THREE.MeshBasicMaterial({ map: glowTex, color, transparent: true,
    blending: THREE.AdditiveBlending, depthWrite: false });

  // ---------- 車輛 ----------
  const CAR_COLORS = [0x8a96a3, 0x5e6b78, 0xb7c0c8, 0x3f4a56, 0x7d8794, 0xa39a8c, 0x6f7f74];
  const glassMat = new THREE.MeshLambertMaterial({ color: 0x0b1118 });
  const tailMat = new THREE.MeshBasicMaterial({ color: 0x8a1018 });
  const headMat = new THREE.MeshBasicMaterial({ color: 0xdfe6ee });
  function makeCar(color) {
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(1.86, 0.7, 4.4), new THREE.MeshLambertMaterial({ color }));
    body.position.y = 0.55; g.add(body);
    const cab = new THREE.Mesh(new THREE.BoxGeometry(1.62, 0.55, 2.2), glassMat);
    cab.position.set(0, 1.17, 0.25); g.add(cab);
    const roof = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.06, 1.9), new THREE.MeshLambertMaterial({ color }));
    roof.position.set(0, 1.47, 0.3); g.add(roof);
    for (const sx of [-0.7, 0.7]) {
      const tl = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.14, 0.05), tailMat); tl.position.set(sx, 0.68, 2.21); g.add(tl);
      const hl = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.14, 0.05), headMat); hl.position.set(sx, 0.62, -2.21); g.add(hl);
    }
    // 方向燈：左右各一組（前、後角）
    g.userData.blink = {};
    for (const side of [-1, 1]) {
      const m = new THREE.MeshBasicMaterial({ color: 0x3a2a08 });
      for (const bz of [-2.15, 2.15]) {
        const b = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.16, 0.22), m);
        b.position.set(side * 0.86, 0.72, bz); g.add(b);
      }
      const halo = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 2.2), glowMat(0xffa020));
      halo.rotation.x = -Math.PI / 2; halo.position.set(side * 0.9, 1.0, 0); halo.material.opacity = 0; g.add(halo);
      g.userData.blink[side] = { m, halo };
    }
    scene.add(g); return g;
  }

  // 兩側車道每 13 公尺一輛；中間車道的車會讓到左右車道的空檔
  const cars = [];
  const mids = [];
  for (let z = -45; z > -320; z -= 30 + rnd() * 10) mids.push({ z0: z, side: rnd() < 0.5 ? -1 : 1 });
  for (const lane of [-1, 1]) for (let z = 40; z > -330; z -= 13) {
    const z0 = z + (rnd() - 0.5) * 3;
    if (mids.some(m => m.side === lane && Math.abs(m.z0 - z0) < 10)) continue;
    cars.push({ lane, z0, side: lane, obj: makeCar(CAR_COLORS[Math.floor(rnd() * CAR_COLORS.length)]) });
  }
  for (const m of mids) cars.push({ lane: 0, z0: m.z0, side: m.side, obj: makeCar(CAR_COLORS[Math.floor(rnd() * CAR_COLORS.length)]) });

  function carShift(c, t) {
    const zc = c.z0 - CAR_V * t;
    const d = (ambZ(t) - LEAD) - zc;           // 車在紅色前緣前方多遠
    const s1 = 1 - smooth(12, 40, d);
    const behind = zc - ambZ(t);               // 車在救護車後方多遠
    const r = smooth(22, 40, behind);
    return grow(t) * s1 * (1 - r);
  }
  function carX(c, t) {
    const s = carShift(c, t);
    return c.lane === 0 ? c.side * LANE * s : c.lane * (LANE + 0.6 * s);
  }

  // ---------- 救護車 ----------
  const amb = new THREE.Group();
  {
    const white = new THREE.MeshLambertMaterial({ color: 0xf2f4f6 });
    const red = new THREE.MeshBasicMaterial({ color: 0xd8202c });
    const box = new THREE.Mesh(new THREE.BoxGeometry(2.24, 2.1, 4.2), white); box.position.set(0, 1.35, 0.6); amb.add(box);
    const cab = new THREE.Mesh(new THREE.BoxGeometry(2.1, 1.45, 1.7), white); cab.position.set(0, 1.0, -2.3); amb.add(cab);
    const ws = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.6, 0.06), glassMat); ws.position.set(0, 1.35, -3.16); amb.add(ws);
    const stripe = new THREE.Mesh(new THREE.BoxGeometry(2.27, 0.26, 4.23), red); stripe.position.set(0, 1.05, 0.6); amb.add(stripe);
    const stripe2 = new THREE.Mesh(new THREE.BoxGeometry(2.13, 0.2, 1.73), red); stripe2.position.set(0, 0.85, -2.3); amb.add(stripe2);
    const c1 = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.03, 1.6), red); c1.position.set(0, 2.42, 0.8); amb.add(c1);
    const c2 = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.03, 0.45), red); c2.position.set(0, 2.42, 0.8); amb.add(c2);
    amb.userData.lr = new THREE.MeshBasicMaterial({ color: 0x400008 });
    amb.userData.lb = new THREE.MeshBasicMaterial({ color: 0x000a40 });
    const lr = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.22, 0.32), amb.userData.lr); lr.position.set(-0.5, 2.52, -1.2); amb.add(lr);
    const lb = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.22, 0.32), amb.userData.lb); lb.position.set(0.5, 2.52, -1.2); amb.add(lb);
    const hr = new THREE.Mesh(new THREE.PlaneGeometry(9, 9), glowMat(0xff2030)); hr.rotation.x = -Math.PI / 2; hr.position.set(-1.2, 0.1, -0.5);
    const hb = new THREE.Mesh(new THREE.PlaneGeometry(9, 9), glowMat(0x2050ff)); hb.rotation.x = -Math.PI / 2; hb.position.set(1.2, 0.1, -0.5);
    const sr = new THREE.Mesh(new THREE.PlaneGeometry(3, 3), glowMat(0xff3040)); sr.position.set(-0.5, 2.6, -1.2); sr.rotation.x = -Math.PI / 2;
    const sb = new THREE.Mesh(new THREE.PlaneGeometry(3, 3), glowMat(0x4070ff)); sb.position.set(0.5, 2.6, -1.2); sb.rotation.x = -Math.PI / 2;
    amb.add(hr, hb, sr, sb);
    amb.userData.glow = { hr, hb, sr, sb };
    for (const sx of [-0.7, 0.7]) {
      const hl = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.16, 0.05), headMat); hl.position.set(sx, 0.6, -3.16); amb.add(hl);
    }
  }
  scene.add(amb);

  // ---------- 鏡頭 ----------
  // 0–9 秒：相對救護車的關鍵影格；9–12 秒：漸變成固定在世界座標的俯拍，救護車往畫面上方開走
  const CAM_KEYS = [
    { t: 0,   pos: [0, 72, 44],  look: [0, 0, -34] },
    { t: 2,   pos: [0, 66, 40],  look: [0, 0, -32] },
    { t: 3.5, pos: [3, 24, 26],  look: [0, 0, -22] },
    { t: 9,   pos: [-3, 20, 22], look: [0, 0, -24] },
  ];
  function followCam(t) {
    let i = 0; while (i < CAM_KEYS.length - 2 && t > CAM_KEYS[i + 1].t) i++;
    const a = CAM_KEYS[i], b = CAM_KEYS[i + 1];
    let u = clamp((t - a.t) / (b.t - a.t), 0, 1);
    if (i !== 2) u = ease(u);                    // 3.5–9 秒等速漂移
    const z = ambZ(t);
    const p = lerpV(a.pos, b.pos, u), l = lerpV(a.look, b.look, u);
    return { pos: [p[0], p[1], p[2] + z], look: [l[0], l[1], l[2] + z] };
  }
  const FIX = { pos: [0, 58, ambZ(9) + 24], look: [0, 0, ambZ(9) - 46] };
  function camAt(t) {
    const f = followCam(Math.min(t, 9));
    if (t <= 9) return f;
    const fNow = followCam(9);
    const dz = ambZ(t) - ambZ(9);
    const fol = { pos: [fNow.pos[0], fNow.pos[1], fNow.pos[2] + dz], look: [fNow.look[0], 0, fNow.look[2] + dz] };
    const u = ease(clamp((t - 9) / 2, 0, 1));
    return { pos: lerpV(fol.pos, FIX.pos, u), look: lerpV(fol.look, FIX.look, u) };
  }

  // ---------- 每一格的狀態（只由 t 決定，方便檢查與重錄） ----------
  const capEl = document.getElementById('cap');
  let capOn = true;
  function render(t) {
    const az = ambZ(t), g = grow(t);
    amb.position.set(0, 0, az);
    const ph = Math.floor(t * 8) % 2;            // 每秒 4 次紅藍交替
    amb.userData.lr.color.setHex(ph ? 0xff2030 : 0x400008);
    amb.userData.lb.color.setHex(ph ? 0x000a40 : 0x3060ff);
    const gl = amb.userData.glow;
    gl.hr.material.opacity = gl.sr.material.opacity = ph ? 0.55 : 0.05;
    gl.hb.material.opacity = gl.sb.material.opacity = ph ? 0.05 : 0.55;

    laneU.uFront.value = frontZ(t);
    laneU.uTail.value = az + 6;
    laneU.uGrow.value = g;
    laneU.uTime.value = t;
    wall.position.set(0, 0.9, frontZ(t));
    wall.material.opacity = g;

    for (const c of cars) {
      const zc = c.z0 - CAR_V * t;
      const x = carX(c, t);
      const vx = (carX(c, t + 0.05) - carX(c, t - 0.05)) / 0.1;
      c.obj.position.set(x, 0, zc);
      c.obj.rotation.y = -Math.atan2(vx, CAR_V);
      let dir = 0;
      if (c.lane === 0) {
        const s = carShift(c, t), d = (az - LEAD) - zc;
        if (vx * c.side > 0.05 || (g > 0 && s < 0.05 && d < 55 && d > 0)) dir = c.side;
        else if (vx * c.side < -0.05) dir = -c.side;
      }
      const on = dir !== 0 && Math.floor(t * 5) % 2 === 0;
      for (const side of [-1, 1]) {
        const lit = on && side === dir;
        c.obj.userData.blink[side].m.color.setHex(lit ? 0xffa020 : 0x3a2a08);
        c.obj.userData.blink[side].halo.material.opacity = lit ? 0.5 : 0;
      }
    }

    const cam = camAt(t);
    camera.position.set(...cam.pos);
    camera.lookAt(...cam.look);

    capEl.style.opacity = capOn ? (smooth(2.3, 2.9, t) * (1 - smooth(8, 8.6, t))).toFixed(3) : 0;
    renderer.render(scene, camera);
  }

  // 檢查用：救護車與車輛的最小間距、車與車是否重疊
  function state(t) {
    const az = ambZ(t);
    let minAmbGap = Infinity, minCarGap = Infinity, carInRedLane = 0;
    const pos = cars.map(c => ({ x: carX(c, t), z: c.z0 - CAR_V * t }));
    for (const p of pos) {
      if (Math.abs(p.x) - (1.12 + 0.93) < 0.3) minAmbGap = Math.min(minAmbGap, Math.abs(p.z - az) - (3.2 + 2.2));
      if (p.z < az && p.z > frontZ(t) && Math.abs(p.x) < LANE / 2 + 0.93) carInRedLane++;
    }
    for (let i = 0; i < pos.length; i++) for (let j = i + 1; j < pos.length; j++) {
      if (Math.abs(pos[i].x - pos[j].x) < 1.9) minCarGap = Math.min(minCarGap, Math.abs(pos[i].z - pos[j].z) - 4.4);
    }
    return { t, ambZ: az, frontLead: +(az - frontZ(t)).toFixed(2), minAmbGap: +minAmbGap.toFixed(2),
      minCarGap: +minCarGap.toFixed(2), carInRedLane, cars: cars.length };
  }
  window.flow = { render, state, T_END };

  // ---------- 播放控制 ----------
  const scrub = document.getElementById('scrub'), tc = document.getElementById('tc');
  let playing = false, start = 0, cur = parseFloat(params.get('t')) || 0;
  // 音效與動畫同一條時間軸：播放時把音軌對到目前秒數
  const sfx = document.getElementById('sfx');
  const play = () => { playing = true; start = performance.now() - cur * 1000;
    sfx.currentTime = cur; sfx.play().catch(() => {}); };
  const restart = () => { cur = 0; play(); };
  document.getElementById('go').onclick = restart;
  document.getElementById('replay').onclick = restart;
  document.getElementById('capBtn').onclick = e => { capOn = !capOn; e.target.textContent = '字卡：' + (capOn ? '開' : '關'); };
  document.getElementById('sndBtn').onclick = e => { sfx.muted = !sfx.muted; e.target.textContent = '音效：' + (sfx.muted ? '關' : '開'); };
  scrub.oninput = () => { playing = false; sfx.pause(); cur = parseFloat(scrub.value); };
  addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); restart(); } });

  function fit() {
    const s = Math.min(innerWidth / W, innerHeight / H);
    document.getElementById('stage').style.transform = `translate(-50%,-50%) scale(${s})`;
  }
  addEventListener('resize', fit); fit();

  function loop(now) {
    if (playing) {
      cur = Math.min((now - start) / 1000, T_END);
      if (cur >= T_END) playing = false;
    }
    scrub.value = cur; tc.textContent = cur.toFixed(1) + ' s';
    render(cur);
    requestAnimationFrame(loop);
  }
  // 影片版：停在第一格 1 秒（方便開始錄影）後自動播放；按空白鍵重播（瀏覽器要先有一次按鍵或點擊才會出聲）
  if (CLEAN && !params.has('t')) setTimeout(play, 1000);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
